<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What to wear today?</title>
<style>
:root {
  --bg: #ffe6f4;
  --card: #fff8fc;
  --accent: #ff7fbf;
  --accent-soft: #ffd3eb;
  --text: #7a2a5c;
  --muted: #c0699c;
  --shadow: 0 10px 30px rgba(255, 127, 191, 0.28);
  --radius: 22px;
}
body.blue {
  --bg: #0b1d3a;
  --card: #132a4f;
  --accent: #4f8cd9;
  --accent-soft: #1f3d6b;
  --text: #e8eefc;
  --muted: #9fb3d6;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: "Heebo", "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  justify-content: center;
  padding: 24px 16px;
  transition: background 0.3s, color 0.3s;
}
.app { width: 100%; max-width: 420px; }
header { text-align: center; margin-bottom: 18px; }
header h1 { margin: 0 0 6px; font-size: 26px; }
header p { margin: 0; color: var(--muted); font-size: 15px; }
.controls { margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
select, input, .btn {
  font-family: inherit;
  font-size: 15px;
  color: var(--text);
  background: var(--card);
  border: 2px solid var(--accent);
  border-radius: 14px;
  padding: 10px 12px;
}
select, input { width: 100%; }
.search { display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; }
.btn { cursor: pointer; }
.row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.themes { display: flex; gap: 8px; }
.themes button {
  font-family: inherit; font-size: 14px; color: var(--text);
  background: transparent; border: 2px solid var(--accent);
  border-radius: 999px; padding: 8px 14px; cursor: pointer;
}
.themes button.active { background: var(--accent); color: #fff; }
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px;
  margin-bottom: 16px;
}
.now { text-align: center; }
.city { color: var(--muted); font-size: 15px; }
.temp { font-size: 64px; font-weight: 700; margin: 6px 0; color: var(--accent); }
.condition { font-size: 18px; margin-bottom: 4px; }
.hilo { color: var(--muted); font-size: 15px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
.stat { background: var(--accent-soft); border-radius: 14px; padding: 10px 6px; text-align: center; font-size: 13px; }
.stat b { display: block; font-size: 17px; margin-top: 4px; }
.summary { font-size: 17px; line-height: 1.6; margin: 0; }
h2 { font-size: 19px; margin: 0 0 12px; }
.outfit { list-style: none; padding: 0; margin: 0; }
.outfit li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--accent-soft); font-size: 16px; }
.outfit li:last-child { border-bottom: none; }
.outfit .icon { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.tip { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); font-size: 15px; line-height: 1.5; }
.msg { color: var(--muted); font-size: 14px; text-align: center; margin: 6px 0 0; min-height: 18px; }
footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 data-i18n="title"></h1>
    <p data-i18n="subtitle"></p>
  </header>

  <div class="controls">
    <select id="langSelect" onchange="setLang(this.value)">
      <option value="he">עברית</option>
      <option value="en">English</option>
      <option value="ru">Русский</option>
    </select>
    <select id="citySelect" onchange="onSelectChange(this.value)"></select>
    <div class="search">
      <input id="searchInput" type="text" data-i18n-ph="searchPh" onkeydown="if(event.key==='Enter')searchCity()">
      <button class="btn" data-i18n="searchBtn" onclick="searchCity()"></button>
    </div>
    <div class="row">
      <div class="themes">
        <button id="btn-pink" data-i18n="pink" onclick="setTheme('pink')"></button>
        <button id="btn-blue" data-i18n="blue" onclick="setTheme('blue')"></button>
      </div>
    </div>
    <p class="msg" id="msg"></p>
  </div>

  <section class="card now">
    <div class="city" id="city"></div>
    <div class="temp" id="temp"></div>
    <div class="condition" id="condition"></div>
    <div class="hilo" id="hilo"></div>
    <div class="stats">
      <div class="stat"><span data-i18n="feels"></span><b id="feels"></b></div>
      <div class="stat"><span data-i18n="wind"></span><b id="wind"></b></div>
      <div class="stat"><span data-i18n="humidity"></span><b id="humidity"></b></div>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="summaryTitle"></h2>
    <p class="summary" id="summary"></p>
  </section>

  <section class="card">
    <h2 data-i18n="outfitTitle"></h2>
    <ul class="outfit" id="outfit"></ul>
    <div class="tip" id="tip"></div>
  </section>

  <footer data-i18n="footer"></footer>
</div>

const STORAGE = { loc: "outfit-app-location", theme: "outfit-app-theme", lang: "outfit-app-lang" };
let lang = "he";
let theme = "pink";
let current = null;   // { custom?: string, idx?: number, geo?: boolean, lat, lon }
let lastRaw = null;   // נתונים גולמיים, כדי לתרגם מחדש בלי לקרוא שוב לשירות

const t = () => T[lang];

function cityName(p) {
  if (p.geo) return t().myLocation;
  if (p.idx !== undefined) return CITIES[p.idx].names[lang];
  return p.custom;
}

// ---------- ממשק ----------
function applyStaticText() {
  const ui = t();
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
  document.title = ui.title;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = ui[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = ui[el.dataset.i18nPh]; });
  document.getElementById("langSelect").value = lang;
  populateSelect();
}

function populateSelect() {
  const sel = document.getElementById("citySelect");
  const keep = sel.value;
  sel.innerHTML = "";
  sel.add(new Option(t().geoOpt, "geo"));
  CITIES.forEach((c, i) => sel.add(new Option(c.names[lang], String(i))));
  if (current) {
    if (current.geo) sel.value = "geo";
    else if (current.idx !== undefined) sel.value = String(current.idx);
    else sel.value = keep;
  }
}

function setLang(value, save = true) {
  lang = T[value] ? value : "he";
  if (save) try { localStorage.setItem(STORAGE.lang, lang); } catch (e) {}
  applyStaticText();
  if (current) document.getElementById("city").textContent = cityName(current);
  if (lastRaw) render(lastRaw);
}

function setTheme(name, save = true) {
  theme = name;
  document.body.classList.toggle("blue", name === "blue");
  document.getElementById("btn-pink").classList.toggle("active", name === "pink");
  document.getElementById("btn-blue").classList.toggle("active", name === "blue");
  if (save) try { localStorage.setItem(STORAGE.theme, name); } catch (e) {}
}

function setMsg(text) {
  document.getElementById("msg").textContent = text || "";
}

function onSelectChange(value) {
  if (value === "geo") return useMyLocation();
  loadPlace({ idx: Number(value), lat: CITIES[value].lat, lon: CITIES[value].lon });
}

// ---------- Open-Meteo ----------
function condKey(code) {
  if (code === 0) return "clear";
  if (code <= 2) return "partly";
  if (code === 3) return "cloudy";
  if (code === 45 || code === 48) return "fog";
  if (code >= 51 && code <= 67) return "rain";
  if (code >= 71 && code <= 77) return "snow";
  if (code >= 80 && code <= 82) return "showers";
  if (code >= 95) return "storm";
  return "partly";
}
const ICONS = { clear: "☀️", partly: "⛅", cloudy: "☁️", fog: "🌫️", rain: "🌧️", snow: "❄️", showers: "🌦️", storm: "⛈️" };

async function fetchWeather(place) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}` +
    `&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code` +
    `&daily=temperature_2m_max,temperature_2m_min,sunset,uv_index_max,precipitation_probability_max` +
    `&timezone=Asia%2FJerusalem&wind_speed_unit=kmh`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("weather");
  const d = await res.json();
  return {
    temp: Math.round(d.current.temperature_2m),
    feels: Math.round(d.current.apparent_temperature),
    high: Math.round(d.daily.temperature_2m_max[0]),
    low: Math.round(d.daily.temperature_2m_min[0]),
    humidity: Math.round(d.current.relative_humidity_2m),
    windKmh: Math.round(d.current.wind_speed_10m),
    rainChance: d.daily.precipitation_probability_max[0] || 0,
    uvIndex: d.daily.uv_index_max[0] || 0,
    sunset: d.daily.sunset[0].slice(11, 16),
    code: d.current.weather_code
  };
}

async function loadPlace(place) {
  current = place;
  lastRaw = null;
  document.getElementById("city").textContent = cityName(place);
  document.getElementById("summary").textContent = t().loading;
  setMsg("");
  try {
    lastRaw = await fetchWeather(place);
    render(lastRaw);
    saveLocation(place);
    populateSelect();
  } catch (e) {
    document.getElementById("summary").textContent = "";
    setMsg(t().loadFail);
  }
}

// ---------- חיפוש ----------
async function searchCity() {
  const q = document.getElementById("searchInput").value.trim();
  if (!q) return;
  setMsg(t().loading);
  try {
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=${lang}&country=IL`;
    const g = await (await fetch(url)).json();
    if (!g.results || !g.results.length) {
      setMsg(t().noResult);
      return;
    }
    const r = g.results[0];
    document.getElementById("searchInput").value = "";
    loadPlace({ custom: r.name, lat: r.latitude, lon: r.longitude });
  } catch (e) {
    setMsg(t().searchFail);
  }
}

// ---------- מיקום ----------
function useMyLocation() {
  if (!navigator.geolocation) {
    setMsg(t().noGeo);
    populateSelect();
    return;
  }
  setMsg(t().locating);
  navigator.geolocation.getCurrentPosition(
    pos => {
      setMsg("");
      loadPlace({ geo: true, lat: pos.coords.latitude, lon: pos.coords.longitude });
    },
    () => { setMsg(t().geoFail); populateSelect(); },
    { timeout: 8000 }
  );
}

// ---------- שמירה ----------
function saveLocation(p) {
  try { localStorage.setItem(STORAGE.loc, JSON.stringify(p)); } catch (e) {}
}
function readSavedLocation() {
  try { return JSON.parse(localStorage.getItem(STORAGE.loc)); } catch (e) { return null; }
}

// ---------- לבוש ----------
function buildOutfit(w) {
  const I = t().items;
  const items = [];
  const f = w.feels;

  if (f >= 27) {
    items.push({ icon: "👚", text: I.hot1 });
    items.push({ icon: "🩴", text: I.hot2 });
  } else if (f >= 22) {
    items.push({ icon: "👕", text: I.mild1 });
    items.push({ icon: "👟", text: I.mild2 });
  } else if (f >= 16) {
    items.push({ icon: "🧥", text: I.cool1 });
    items.push({ icon: "👖", text: I.cool2 });
  } else {
    items.push({ icon: "🧣", text: I.cold1 });
    items.push({ icon: "👢", text: I.cold2 });
  }

  if (w.rainChance >= 40) items.push({ icon: "☔", text: I.rain });
  if (w.windKmh >= 20) items.push({ icon: "🌬️", text: I.wind });
  if (w.uvIndex >= 6) items.push({ icon: "🧴", text: I.sun });
  else items.push({ icon: "🕶️", text: I.shades });
  return items;
}

function buildTip(w) {
  const ui = t();
  if (w.feels >= 27) return ui.tipHot;
  if (w.feels >= 22) return ui.tipMild;
  return ui.tipCool;
}

// ---------- רינדור ----------
function render(w) {
  const ui = t();
  const key = condKey(w.code);
  const condText = ui.cond[key];

  document.getElementById("city").textContent = cityName(current);
  document.getElementById("temp").textContent = `${w.temp}°`;
  document.getElementById("condition").textContent = `${ICONS[key]} ${condText}`;
  document.getElementById("hilo").textContent = ui.todayHL(w.high, w.low);
  document.getElementById("feels").textContent = `${w.feels}°`;
  document.getElementById("wind").textContent = `${w.windKmh} ${ui.windUnit}`;
  document.getElementById("humidity").textContent = `${w.humidity}%`;
  document.getElementById("summary").textContent = ui.summary(w, condText);

  const list = document.getElementById("outfit");
  list.innerHTML = "";
  buildOutfit(w).forEach(item => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="icon">${item.icon}</span><span></span>`;
    li.querySelector("span:last-child").textContent = item.text;
    list.appendChild(li);
  });
  document.getElementById("tip").textContent = buildTip(w);
}

// ---------- התחלה ----------
(function init() {
  let savedLang = "he", savedTheme = "pink";
  try {
    savedLang = localStorage.getItem(STORAGE.lang) || "he";
    savedTheme = localStorage.getItem(STORAGE.theme) || "pink";
  } catch (e) {}
  lang = T[savedLang] ? savedLang : "he";
  applyStaticText();
  setTheme(savedTheme, false);

  const saved = readSavedLocation();
  if (saved && saved.geo) useMyLocation();
  else if (saved && saved.custom) loadPlace(saved);
  else if (saved && saved.idx !== undefined && CITIES[saved.idx]) loadPlace(saved);
  else loadPlace({ idx: 0, lat: CITIES[0].lat, lon: CITIES[0].lon });
})();
</script>
