<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מה ללבוש היום?</title>
<style>
:root {
  --bg: #ffe6f4;
  --card: #fff8fc;
  --accent: #ff7fbf;
  --accent-soft: #ffd3eb;
  --text: #7a2a5c;
  --muted: #c0699c;
  --shadow: 0 10px 30px rgba(255, 127, 191, 0.28);
  --radius: 22px;
}
body.blue {
  --bg: #0b1d3a;
  --card: #132a4f;
  --accent: #4f8cd9;
  --accent-soft: #1f3d6b;
  --text: #e8eefc;
  --muted: #9fb3d6;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: "Heebo", "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  justify-content: center;
  padding: 24px 16px;
  transition: background 0.3s, color 0.3s;
}
.app { width: 100%; max-width: 420px; }
header { text-align: center; margin-bottom: 18px; }
header h1 { margin: 0 0 6px; font-size: 26px; }
header p { margin: 0; color: var(--muted); font-size: 15px; }
.themes {
  display: flex; gap: 8px; justify-content: center; margin: 16px 0 20px;
}
.themes button {
  border: 2px solid var(--accent);
  background: transparent;
  color: var(--text);
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
  font-size: 14px;
  font-family: inherit;
}
.themes button.active { background: var(--accent); color: #fff; }
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px;
  margin-bottom: 16px;
}
.now { text-align: center; }
.city { color: var(--muted); font-size: 15px; }
.temp { font-size: 64px; font-weight: 700; margin: 6px 0; color: var(--accent); }
.condition { font-size: 18px; margin-bottom: 4px; }
.hilo { color: var(--muted); font-size: 15px; }
.stats {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px;
}
.stat {
  background: var(--accent-soft);
  border-radius: 14px;
  padding: 10px 6px;
  text-align: center;
  font-size: 13px;
}
.stat b { display: block; font-size: 17px; margin-top: 4px; }
.summary { font-size: 17px; line-height: 1.6; margin: 0; }
h2 { font-size: 19px; margin: 0 0 12px; }
.outfit { list-style: none; padding: 0; margin: 0; }
.outfit li {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0;
  border-bottom: 1px dashed var(--accent-soft);
  font-size: 16px;
}
.outfit li:last-child { border-bottom: none; }
.outfit .icon {
  width: 40px; height: 40px; border-radius: 12px;
  background: var(--accent-soft);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.tip {
  margin-top: 14px; padding: 12px 14px; border-radius: 14px;
  background: var(--accent-soft); font-size: 15px; line-height: 1.5;
}
footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>מה ללבוש היום? ✨</h1>
    <p>הנה מה שאני חושב על היום בחוץ</p>
  </header>


  <div style="margin-bottom:16px">
    <select onchange="setCity(this.value)" style="width:100%;padding:10px 12px;border-radius:14px;border:2px solid var(--accent);background:var(--card);color:var(--text);font-family:inherit;font-size:15px">
      <option value="ירושלים">ירושלים</option>
      <option value="תל אביב">תל אביב</option>
    </select>
  </div>

  <div class="themes">
    <button id="btn-pink" class="active" onclick="setTheme('pink')">ורוד בייבי</button>
    <button id="btn-blue" onclick="setTheme('blue')">כחול כהה</button>
  </div>

  <section class="card now">
    <div class="city" id="city"></div>
    <div class="temp" id="temp"></div>
    <div class="condition" id="condition"></div>
    <div class="hilo" id="hilo"></div>
    <div class="stats">
      <div class="stat">מרגיש כמו<b id="feels"></b></div>
      <div class="stat">רוח<b id="wind"></b></div>
      <div class="stat">לחות<b id="humidity"></b></div>
    </div>
  </section>

  <section class="card">
    <h2>בקצרה</h2>
    <p class="summary" id="summary"></p>
  </section>

  <section class="card">
    <h2>מה ללבוש</h2>
    <ul class="outfit" id="outfit"></ul>
    <div class="tip" id="tip"></div>
  </section>

  <footer>הנתונים הם צילום מצב של מזג האוויר ואינם מתעדכנים אוטומטית</footer>
</div>

<script>
// נתוני מזג האוויר (צילום מצב). לשינוי: ערכו את הערכים כאן.
const CITIES = {
  "ירושלים": {
    city: "ירושלים",
    temp: 29,
    feels: 29,
    high: 31,
    low: 19,
    condition: "בהיר",
    rainChance: 0,
    windKmh: 14,
    windDir: "צפון-מערב",
    humidity: 47,
    uv: "נמוך",
    sunset: "19:46"
  },
  "תל אביב": {
    city: "תל אביב",
    temp: 31,
    feels: 34,
    high: 31,
    low: 24,
    condition: "בהיר",
    rainChance: 0,
    windKmh: 11,
    windDir: "מערב",
    humidity: 55,
    uv: "מאוד גבוה",
    sunset: "19:47"
  }
};
let WEATHER = CITIES["ירושלים"];


function setCity(name) {
  WEATHER = CITIES[name];
  render();
}

function setTheme(name) {
  document.body.classList.toggle("blue", name === "blue");
  document.getElementById("btn-pink").classList.toggle("active", name === "pink");
  document.getElementById("btn-blue").classList.toggle("active", name === "blue");
}

function buildOutfit(w) {
  const items = [];
  const f = w.feels;

  if (f >= 27) {
    items.push({ icon: "👚", text: "טי-שירט או טופ קל מבד נושם, שורטס או חצאית באורך נוח" });
    items.push({ icon: "🩴", text: "סנדלים או כפכפים, מה שנותן לרגליים לנשום" });
  } else if (f >= 22) {
    items.push({ icon: "👕", text: "חולצה קלה עם שרוולים, ומכנסיים ארוכים או שמלה" });
    items.push({ icon: "👟", text: "נעליים נוחות, לא צריך יותר מזה" });
  } else if (f >= 16) {
    items.push({ icon: "🧥", text: "ז'קט קל או סוודר דק, כי בערב זה מתקרר" });
    items.push({ icon: "👖", text: "ג'ינס או מכנסיים ארוכים" });
  } else {
    items.push({ icon: "🧣", text: "מעיל חם, סוודר וצעיף" });
    items.push({ icon: "👢", text: "נעליים סגורות ושמורות מקור" });
  }

  if (w.rainChance >= 40) {
    items.push({ icon: "☔", text: "מטריה או מעיל עמיד למים" });
  }
  if (w.windKmh >= 20) {
    items.push({ icon: "🌬️", text: "משהו שלא יתעופף: מעיל קל או שכבה נוספת" });
  }
  if (w.uv === "גבוה" || w.uv === "מאוד גבוה") {
    items.push({ icon: "🧴", text: "קרם הגנה ומשקפי שמש, השמש חזקה" });
  } else {
    items.push({ icon: "🕶️", text: "משקפי שמש, תמיד נחמדים גם כשלא חם מדי" });
  }
  return items;
}

function buildSummary(w) {
  let s = `עכשיו ${w.temp}° ו${w.condition}. היום יגיע עד ${w.high}°, ובלילה ירד עד ${w.low}°. `;
  if (w.feels >= 27) s += "יום חם, תשתו הרבה מים ותחפשו צל. ";
  else if (w.feels >= 22) s += "יום נעים ונוח לצאת החוצה. ";
  else s += "אוויר קריר יותר, כדאי שכבה נוספת. ";
  s += `השקיעה ב-${w.sunset}, אז יש זמן לנשום קצת אוויר.`;
  return s;
}

function buildTip(w) {
  if (w.feels >= 27) return "טיפ: שמרו בתיק בקבוק מים, ביום כזה זה מציל.";
  if (w.feels >= 22) return "טיפ: לקחו שכבה קלה לערב, כי הלילה יורד הרבה.";
  return "טיפ: שכבות זה הסוד. אפשר להוריד או להוסיף לפי הצורך.";
}

function render() {
  const w = WEATHER;
  document.getElementById("city").textContent = w.city;
  document.getElementById("temp").textContent = `${w.temp}°`;
  document.getElementById("condition").textContent = w.condition;
  document.getElementById("hilo").textContent = `היום: ${w.high}° / ${w.low}°`;
  document.getElementById("feels").textContent = `${w.feels}°`;
  document.getElementById("wind").textContent = `${w.windKmh} קמ"ש`;
  document.getElementById("humidity").textContent = `${w.humidity}%`;
  document.getElementById("summary").textContent = buildSummary(w);

  const list = document.getElementById("outfit");
  list.innerHTML = "";
  buildOutfit(w).forEach(item => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="icon">${item.icon}</span><span></span>`;
    li.querySelector("span:last-child").textContent = item.text;
    list.appendChild(li);
  });
  document.getElementById("tip").textContent = buildTip(w);
}

render();
</script>
</body>
</html>
