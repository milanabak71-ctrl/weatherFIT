<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outfit</title>
<style>
:root {
  --bg: #ffe6f4; --card: #fff8fc; --accent: #ff7fbf; --accent-soft: #ffd3eb;
  --text: #7a2a5c; --muted: #c0699c; --shadow: 0 10px 30px rgba(255,127,191,.28);
}
body.blue {
  --bg: #0b1d3a; --card: #132a4f; --accent: #4f8cd9; --accent-soft: #1f3d6b;
  --text: #e8eefc; --muted: #9fb3d6; --shadow: 0 10px 30px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding: 24px 16px;
  font-family: Arial, sans-serif; background: var(--bg); color: var(--text);
  display: flex; justify-content: center;
}
.app { width: 100%; max-width: 420px; }
h1 { margin: 0 0 6px; font-size: 26px; text-align: center; }
.sub { margin: 0 0 18px; color: var(--muted); text-align: center; font-size: 15px; }
.controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
select, input, .btn {
  font-family: inherit; font-size: 15px; color: var(--text); background: var(--card);
  border: 2px solid var(--accent); border-radius: 14px; padding: 10px 12px; width: 100%;
}
.search { display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; width: auto; }
.search .btn { width: auto; cursor: pointer; }
.themes { display: flex; gap: 8px; justify-content: center; }
.themes button {
  font-family: inherit; font-size: 14px; color: var(--text); background: transparent;
  border: 2px solid var(--accent); border-radius: 999px; padding: 8px 14px; cursor: pointer;
}
.themes button.active { background: var(--accent); color: #fff; }
.msg { color: var(--muted); font-size: 14px; text-align: center; min-height: 18px; margin: 0; }
.card { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); padding: 22px; margin-bottom: 16px; }
.now { text-align: center; }
.place { color: var(--muted); font-size: 15px; }
.temp { font-size: 64px; font-weight: 700; color: var(--accent); margin: 6px 0; }
.cond { font-size: 18px; }
.hilo { color: var(--muted); font-size: 15px; margin-top: 4px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
.stat { background: var(--accent-soft); border-radius: 14px; padding: 10px 6px; font-size: 13px; }
.stat b { display: block; font-size: 17px; margin-top: 4px; }
h2 { font-size: 19px; margin: 0 0 12px; }
.summary { font-size: 17px; line-height: 1.6; margin: 0; }
.outfit { list-style: none; padding: 0; margin: 0; }
.outfit li { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px dashed var(--accent-soft); font-size: 16px; }
.outfit li:last-child { border-bottom: none; }
.icon { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.tip { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); font-size: 15px; line-height: 1.5; }
footer { text-align: center; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="app">
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>

  <div class="controls">
    <select id="langSelect" onchange="setLang(this.value)">
      <option value="he">עברית</option>
      <option value="en">English</option>
      <option value="ru">Русский</option>
    </select>
    <select id="citySelect" onchange="onCityChange(this.value)"></select>
    <div class="search">
      <input id="searchInput" type="text" onkeydown="if(event.key==='Enter')searchCity()">
      <button class="btn" id="searchBtn" onclick="searchCity()"></button>
    </div>
    <div class="themes">
      <button id="btn-pink" onclick="setTheme('pink')"></button>
      <button id="btn-blue" onclick="setTheme('blue')"></button>
    </div>
    <p class="msg" id="msg"></p>
  </div>

  <section class="card now">
    <div class="place" id="place"></div>
    <div class="temp" id="temp">--</div>
    <div class="cond" id="cond"></div>
    <div class="hilo" id="hilo"></div>
    <div class="stats">
      <div class="stat"><span id="feelsL"></span><b id="feels">--</b></div>
      <div class="stat"><span id="windL"></span><b id="wind">--</b></div>
      <div class="stat"><span id="humL"></span><b id="hum">--</b></div>
    </div>
  </section>

  <section class="card">
    <h2 id="sumT"></h2>
    <p class="summary" id="summary"></p>
  </section>

  <section class="card">
    <h2 id="outT"></h2>
    <ul class="outfit" id="outfit"></ul>
    <div class="tip" id="tip"></div>
  </section>

  <footer id="footer"></footer>
</div>

<script>
// שגיאות בקוד יופיעו על המסך
window.onerror = function (m) {
  document.getElementById("msg").textContent = "שגיאה: " + m;
};

const T = {
  he: {
    title: "מה ללבוש היום? ✨", subtitle: "הנה מה שאני חושב על היום בחוץ",
    ph: "הקלידו שם עיר", search: "חפש", pink: "ורוד בייבי", blue: "כחול כהה",
    feels: "מרגיש כמו", wind: "רוח", hum: "לחות", sumT: "בקצרה", outT: "מה ללבוש",
    footer: "נתונים בזמן אמת משירות Open-Meteo", geoOpt: "📍 המיקום שלי", myLoc: "המיקום שלי",
    loading: "טוען...", noRes: "לא מצאתי עיר בשם הזה", fail: "לא הצלחתי לטעון את הנתונים",
    geoFail: "לא הצלחתי לזהות את המיקום", today: "היום", night: "בלילה", sunset: "שקיעה",
    adv: { hot: "יום חם, תשתו הרבה מים.", mild: "יום נעים לצאת החוצה.", cool: "קריר יותר, כדאי שכבה נוספת." },
    tips: { hot: "טיפ: בקבוק מים בתיק, ביום כזה זה מציל.", mild: "טיפ: שכבה קלה לערב.", cool: "טיפ: שכבות זה הסוד." },
    items: {
      hot: ["טי-שירט קל ושורטס או חצאית", "סנדלים או כפכפים"],
      mild: ["חולצה קלה ומכנסיים ארוכים או שמלה", "נעליים נוחות"],
      cool: ["ז'קט קל או סוודר דק", "ג'ינס או מכנסיים ארוכים"],
      cold: ["מעיל חם, סוודר וצעיף", "נעליים סגורות"],
      rain: "מטריה או מעיל עמיד למים", wind: "מעיל קל שלא יתעופף ברוח",
      sun: "קרם הגנה ומשקפי שמש", shades: "משקפי שמש"
    },
    cond: { clear: "בהיר", partly: "מעונן חלקית", cloudy: "מעונן", fog: "ערפל", rain: "גשם", snow: "שלג", showers: "ממטרים", storm: "סופת רעמים" },
    unit: "קמ\"ש"
  },
  en: {
    title: "What to wear today? ✨", subtitle: "My take on being outside today",
    ph: "Type a city name", search: "Search", pink: "Baby pink", blue: "Dark blue",
    feels: "Feels like", wind: "Wind", hum: "Humidity", sumT: "In short", outT: "What to wear",
    footer: "Live data from Open-Meteo", geoOpt: "📍 My location", myLoc: "My location",
    loading: "Loading...", noRes: "No city found with that name", fail: "Couldn't load the weather",
    geoFail: "Couldn't find your location", today: "Today", night: "tonight", sunset: "Sunset",
    adv: { hot: "It's hot, drink lots of water.", mild: "A nice day to be outside.", cool: "It's cooler, bring an extra layer." },
    tips: { hot: "Tip: keep a water bottle in your bag.", mild: "Tip: bring a light layer for the evening.", cool: "Tip: layers are the secret." },
    items: {
      hot: ["A light tee and shorts or a skirt", "Sandals or flip-flops"],
      mild: ["A light shirt and long pants or a dress", "Comfortable shoes"],
      cool: ["A light jacket or thin sweater", "Jeans or long pants"],
      cold: ["A warm coat, sweater and scarf", "Closed shoes"],
      rain: "An umbrella or waterproof jacket", wind: "A light jacket that won't blow away",
      sun: "Sunscreen and sunglasses", shades: "Sunglasses"
    },
    cond: { clear: "Clear", partly: "Partly cloudy", cloudy: "Cloudy", fog: "Fog", rain: "Rain", snow: "Snow", showers: "Showers", storm: "Thunderstorm" },
    unit: "km/h"
  },
  ru: {
    title: "Что надеть сегодня? ✨", subtitle: "Что я думаю о сегодняшнем дне на улице",
    ph: "Введите название города", search: "Найти", pink: "Нежно-розовый", blue: "Тёмно-синий",
    feels: "Ощущается", wind: "Ветер", hum: "Влажность", sumT: "Коротко", outT: "Что надеть",
    footer: "Данные в реальном времени от Open-Meteo", geoOpt: "📍 Моё местоположение", myLoc: "Моё местоположение",
    loading: "Загружаю...", noRes: "Город не найден", fail: "Не удалось загрузить погоду",
    geoFail: "Не удалось определить местоположение", today: "Сегодня", night: "ночью", sunset: "Закат",
    adv: { hot: "Жарко, пейте много воды.", mild: "Приятный день, чтобы выйти на улицу.", cool: "Прохладнее, возьмите ещё один слой." },
    tips: { hot: "Совет: бутылка воды в сумке, в такой день это спасает.", mild: "Совет: лёгкий слой на вечер.", cool: "Совет: секрет в слоях." },
    items: {
      hot: ["Лёгкая футболка и шорты или юбка", "Сандалии или шлёпанцы"],
      mild: ["Лёгкая рубашка и длинные брюки или платье", "Удобная обувь"],
      cool: ["Лёгкая куртка или тонкий свитер", "Джинсы или длинные брюки"],
      cold: ["Тёплое пальто, свитер и шарф", "Закрытая обувь"],
      rain: "Зонт или водонепроницаемая куртка", wind: "Лёгкая куртка, которую не сдует ветер",
      sun: "Крем от солнца и солнцезащитные очки", shades: "Солнцезащитные очки"
    },
    cond: { clear: "ясно", partly: "переменная облачность", cloudy: "облачно", fog: "туман", rain: "дождь", snow: "снег", showers: "ливень", storm: "гроза" },
    unit: "км/ч"
  }
};

// שם, אנגלית, רוסית, קו רוחב, קו אורך
const CITIES = [
  ["ירושלים", "Jerusalem", "Иерусалим", 31.77, 35.21],
  ["תל אביב", "Tel Aviv", "Тель-Авив", 32.08, 34.78],
  ["חיפה", "Haifa", "Хайфа", 32.79, 34.99],
  ["באר שבע", "Beersheba", "Беэр-Шева", 31.25, 34.79],
  ["אילת", "Eilat", "Эйлат", 29.56, 34.95],
  ["נתניה", "Netanya", "Нетания", 32.33, 34.86],
  ["ראשון לציון", "Rishon LeZion", "Ришон-ле-Цион", 31.97, 34.80],
  ["אשדוד", "Ashdod", "Ашдод", 31.80, 34.66],
  ["אשקלון", "Ashkelon", "Ашкелон", 31.67, 34.57],
  ["הרצליה", "Herzliya", "Герцлия", 32.16, 34.84],
  ["פתח תקווה", "Petah Tikva", "Петах-Тиква", 32.09, 34.89],
  ["רמת גן", "Ramat Gan", "Рамат-Ган", 32.07, 34.82],
  ["חולון", "Holon", "Холон", 32.01, 34.77],
  ["רחובות", "Rehovot", "Реховот", 31.89, 34.81],
  ["כרמיאל", "Karmiel", "Кармиэль", 32.92, 35.30],
  ["עפולה", "Afula", "Афула", 32.61, 35.29],
  ["טבריה", "Tiberias", "Тверия", 32.79, 35.53],
  ["נצרת", "Nazareth", "Назарет", 32.70, 35.30],
  ["צפת", "Safed", "Цфат", 32.96, 35.50],
  ["נהריה", "Nahariya", "Нагария", 33.00, 35.10],
  ["עכו", "Acre", "Акко", 32.92, 35.07],
  ["חדרה", "Hadera", "Хадера", 32.44, 34.92],
  ["בית שאן", "Beit She'an", "Бейт-Шеан", 32.50, 35.50],
  ["קריית שמונה", "Kiryat Shmona", "Кирьят-Шмона", 33.21, 35.57],
  ["שדרות", "Sderot", "Сдерот", 31.52, 34.60],
  ["מודיעין", "Modiin", "Модиин", 31.90, 35.01],
  ["דימונה", "Dimona", "Димона", 31.07, 35.03]
];

const LANG_COL = { he: 0, en: 1, ru: 2 };
let lang = "he";
let theme = "pink";
let place = null; // {idx, custom, geo, lat, lon}
let raw = null;

function L() { return T[lang]; }

function placeName() {
  if (!place) return "";
  if (place.geo) return L().myLoc;
  if (place.idx !== null) return CITIES[place.idx][LANG_COL[lang]];
  return place.custom;
}

function applyText() {
  const u = L();
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
  document.title = u.title;
  document.getElementById("title").textContent = u.title;
  document.getElementById("subtitle").textContent = u.subtitle;
  document.getElementById("searchInput").placeholder = u.ph;
  document.getElementById("searchBtn").textContent = u.search;
  document.getElementById("btn-pink").textContent = u.pink;
  document.getElementById("btn-blue").textContent = u.blue;
  document.getElementById("feelsL").textContent = u.feels;
  document.getElementById("windL").textContent = u.wind;
  document.getElementById("humL").textContent = u.hum;
  document.getElementById("sumT").textContent = u.sumT;
  document.getElementById("outT").textContent = u.outT;
  document.getElementById("footer").textContent = u.footer;
  document.getElementById("langSelect").value = lang;
  populateCities();
}

function populateCities() {
  const sel = document.getElementById("citySelect");
  sel.innerHTML = "";
  sel.add(new Option(L().geoOpt, "geo"));
  CITIES.forEach((c, i) => sel.add(new Option(c[LANG_COL[lang]], String(i))));
  if (place) {
    if (place.geo) sel.value = "geo";
    else if (place.idx !== null) sel.value = String(place.idx);
    else { sel.add(new Option(place.custom, "custom")); sel.value = "custom"; }
  }
}

function setLang(v) {
  lang = T[v] ? v : "he";
  try { localStorage.setItem("oa-lang", lang); } catch (e) {}
  applyText();
  if (raw) render();
}

function setTheme(name) {
  theme = name;
  document.body.classList.toggle("blue", name === "blue");
  document.getElementById("btn-pink").classList.toggle("active", name === "pink");
  document.getElementById("btn-blue").classList.toggle("active", name === "blue");
  try { localStorage.setItem("oa-theme", name); } catch (e) {}
}

function setMsg(t) { document.getElementById("msg").textContent = t || ""; }

function onCityChange(v) {
  if (v === "geo") return useGeo();
  if (v === "custom") return;
  const c = CITIES[Number(v)];
  load({ idx: Number(v), custom: null, geo: false, lat: c[3], lon: c[4] });
}

function condKey(code) {
  if (code === 0) return "clear";
  if (code <= 2) return "partly";
  if (code === 3) return "cloudy";
  if (code === 45 || code === 48) return "fog";
  if (code >= 51 && code <= 67) return "rain";
  if (code >= 71 && code <= 77) return "snow";
  if (code >= 80 && code <= 82) return "showers";
  if (code >= 95) return "storm";
  return "partly";
}
const ICON = { clear: "☀️", partly: "⛅", cloudy: "☁️", fog: "🌫️", rain: "🌧️", snow: "❄️", showers: "🌦️", storm: "⛈️" };

async function load(p) {
  place = p;
  raw = null;
  setMsg(L().loading);
  document.getElementById("place").textContent = placeName();
  populateCities();
  try {
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + p.lat + "&longitude=" + p.lon +
      "&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code" +
      "&daily=temperature_2m_max,temperature_2m_min,sunset,uv_index_max,precipitation_probability_max" +
      "&timezone=Asia%2FJerusalem&wind_speed_unit=kmh";
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();
    raw = {
      temp: Math.round(d.current.temperature_2m),
      feels: Math.round(d.current.apparent_temperature),
      hum: Math.round(d.current.relative_humidity_2m),
      wind: Math.round(d.current.wind_speed_10m),
      code: d.current.weather_code,
      high: Math.round(d.daily.temperature_2m_max[0]),
      low: Math.round(d.daily.temperature_2m_min[0]),
      rain: d.daily.precipitation_probability_max[0] || 0,
      uv: d.daily.uv_index_max[0] || 0,
      sunset: d.daily.sunset[0].slice(11, 16)
    };
    setMsg("");
    render();
    try { localStorage.setItem("oa-place", JSON.stringify(p)); } catch (e) {}
  } catch (e) {
    setMsg(L().fail + " (" + e.message + ")");
  }
}

async function searchCity() {
  const q = document.getElementById("searchInput").value.trim();
  if (!q) return;
  setMsg(L().loading);
  try {
    const url = "https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(q) +
      "&count=1&language=" + lang + "&country=IL";
    const g = await (await fetch(url)).json();
    if (!g.results || !g.results.length) { setMsg(L().noRes); return; }
    const r = g.results[0];
    document.getElementById("searchInput").value = "";
    load({ idx: null, custom: r.name, geo: false, lat: r.latitude, lon: r.longitude });
  } catch (e) {
    setMsg(L().fail + " (" + e.message + ")");
  }
}

function useGeo() {
  if (!navigator.geolocation) { setMsg(L().geoFail); return; }
  setMsg(L().loading);
  navigator.geolocation.getCurrentPosition(
    pos => load({ idx: null, custom: null, geo: true, lat: pos.coords.latitude, lon: pos.coords.longitude }),
    () => { setMsg(L().geoFail); populateCities(); }
  );
}

function outfitFor(w) {
  const I = L().items;
  const out = [];
  const f = w.feels;
  let cat = f >= 27 ? "hot" : f >= 22 ? "mild" : f >= 16 ? "cool" : "cold";
  out.push({ icon: "👕", text: I[cat][0] });
  out.push({ icon: "👟", text: I[cat][1] });
  if (w.rain >= 40) out.push({ icon: "☔", text: I.rain });
  if (w.wind >= 20) out.push({ icon: "🌬️", text: I.wind });
  out.push(w.uv >= 6 ? { icon: "🧴", text: I.sun } : { icon: "🕶️", text: I.shades });
  return { items: out, cat };
}

function render() {
  if (!raw) return;
  const u = L();
  const w = raw;
  const key = condKey(w.code);
  const cond = u.cond[key];
  const oc = outfitFor(w);

  document.getElementById("place").textContent = placeName();
  document.getElementById("temp").textContent = w.temp + "°";
  document.getElementById("cond").textContent = ICON[key] + " " + cond;
  document.getElementById("hilo").textContent = u.today + ": " + w.high + "° / " + w.low + "°";
  document.getElementById("feels").textContent = w.feels + "°";
  document.getElementById("wind").textContent = w.wind + " " + u.unit;
  document.getElementById("hum").textContent = w.hum + "%";

  document.getElementById("summary").textContent =
    cond + ", " + w.temp + "°. " + u.today + " " + w.high + "°, " + u.night + " " + w.low + "°. " +
    u.adv[oc.cat] + " " + u.sunset + " " + w.sunset + ".";

  const list = document.getElementById("outfit");
  list.innerHTML = "";
  oc.items.forEach(it => {
    const li = document.createElement("li");
    const ic = document.createElement("span");
    ic.className = "icon";
    ic.textContent = it.icon;
    const tx = document.createElement("span");
    tx.textContent = it.text;
    li.appendChild(ic);
    li.appendChild(tx);
    list.appendChild(li);
  });
  document.getElementById("tip").textContent = u.tips[oc.cat];
}

(function init() {
  try {
    lang = localStorage.getItem("oa-lang") || "he";
    theme = localStorage.getItem("oa-theme") || "pink";
  } catch (e) {}
  if (!T[lang]) lang = "he";
  document.getElementById("langSelect").value = lang;
  applyText();
  setTheme(theme);

  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("oa-place")); } catch (e) {}
  if (saved && saved.geo) load(saved);
  else if (saved && (saved.idx !== null || saved.custom)) load(saved);
  else load({ idx: 0, custom: null, geo: false, lat: CITIES[0][3], lon: CITIES[0][4] });
})();
</script>
</body>
</html>
